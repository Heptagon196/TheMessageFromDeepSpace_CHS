# 《The Message from Deep Space》简体中文补丁配置
# 翻译、字体、对白颜色、兼容设置、界面排布、作弊功能和题目及答案修正规则可按 F5 热重载。
# “显示模式”也可在游戏运行时用快捷键切换。

[Localization]
# 汉化补丁总开关。
Enabled = true

# 运行时切换“仅译文 / 仅原文”的快捷键。默认 F8；写 None 可禁用。
# 组合键必须把主键写在前面，例如：F8 + LeftControl
ToggleModeHotkey = F8

# 运行时重新读取四个翻译 JSON、[Font]、[DialogueColors]、[Compatibility]、
# [Layout]、[PuzzleFixes]、[Cheats]、DeepSpaceChinese\Fix 中的题目及答案规则和中文字体的快捷键。
# 默认 F5；写 None 可禁用。修改这些内容后无需重启游戏。
ReloadTranslationsHotkey = F5

# 缺少译文或译文校验失败时是否显示英文原文。
FallbackToOriginal = true

# 可分别关闭某类翻译。
# 对白显示会自动测量实际字体宽度：超长不超过 1.5 倍时缩小字号，超过时自动分页。
TranslateDialogue = true
TranslateLogs = true
TranslateUI = true
TranslateSystem = true

[Compatibility]
# 编译词典词名时是否忽略对应的中英文标点差异。默认开启。
# 等价标点：,↔，  .↔。  ;↔；  ( )↔（ ）  [ ]↔【 】。
# 该规则也用于词典命名冲突检查，避免保存只有这些标点不同的重复词名。
CompilerPunctuationInsensitive = true

[Layout]
# 是否把“新单词命名”浮窗列表移到右下角。默认开启。
# 保持列表原有顺序和行距，并从右下角向上排列。
NewWordPromptLowerRight = true

[PuzzleFixes]
# 是否应用 DeepSpaceChinese\Fix 中的题目及答案修正规则。默认开启。
# 题面和答案集可单独修正；两者都提供时，原题面和原始答案集必须都匹配才会替换。
Enabled = true

[Cheats]
# 在回复框中依次输入 ↑ ↑ ↓ ↓ ← → ← → B A 后，填入当前题目的正确答案。
# 只填入，不会自动提交。默认开启；可按 F5 热重载。
KonamiAnswerAutofill = true

[DialogueColors]
# 是否按说话者给对白着色。false = 使用游戏原本的文字颜色。
Enabled = true

# 颜色格式为 #RRGGBB。默认色针对黑色和深蓝黑背景选择，均保持较高对比度。
Akers = #FFD166
Bautista = #7FDBFF
Collins = #FF9BD2
Doppler = #A7E87B
AutoLog = #E6E6E6
Pilot = #C7B8FF
CoPilot = #FFB07C

[Font]
# Auto = 优先随包字体，再尝试自定义文件和系统字体。
# Bundled = 只使用随包字体；File = 只使用 FontFile；System = 只用系统字体。
FontSource = Auto

# 相对于 DeepSpaceChinese 文件夹的随包字体路径。
BundledFont = Fonts\fusion-pixel-12px-proportional-zh_hans.otf

# 自定义字体文件。可填绝对路径，或填相对于游戏根目录的路径；留空则不用。
FontFile =

# 系统字体候选，以分号分隔，仅在 Auto/System 模式下作为兜底。
SystemFontCandidates = Microsoft YaHei;Noto Sans CJK SC;SimHei
